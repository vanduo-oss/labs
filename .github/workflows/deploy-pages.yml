name: Deploy static content to Pages

# Labs dogfoods sibling vdl-* repos via link:../vdl-*. Check them out beside
# labs/ and build dist/ (gitignored) before install/build/deploy.

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs
    steps:
      - name: Checkout Labs
        uses: actions/checkout@v4
        with:
          path: labs

      - name: Checkout vdl-cbun
        uses: actions/checkout@v4
        with:
          repository: vanduo-oss/vdl-cbun
          path: vdl-cbun

      - name: Checkout vdl-hybrid-search
        uses: actions/checkout@v4
        with:
          repository: vanduo-oss/vdl-hybrid-search
          path: vdl-hybrid-search

      - name: Checkout vdl-ai-chat
        uses: actions/checkout@v4
        with:
          repository: vanduo-oss/vdl-ai-chat
          path: vdl-ai-chat

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            labs/pnpm-lock.yaml
            vdl-cbun/pnpm-lock.yaml
            vdl-hybrid-search/pnpm-lock.yaml
            vdl-ai-chat/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in vdl-cbun vdl-hybrid-search vdl-ai-chat; do
            echo "::group::Build $pkg"
            pnpm install --frozen-lockfile --dir "$pkg"
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: labs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
