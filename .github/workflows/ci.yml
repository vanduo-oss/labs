name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Labs dogfoods sibling vdl-* repos via link:../vdl-*. Check them out beside
# labs/ and build dist/ (gitignored) before install/test/build.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: labs
    steps:
      - name: Checkout Labs
        uses: actions/checkout@v7
        with:
          path: labs

      - name: Checkout vdl-cbun
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-cbun
          path: vdl-cbun

      - name: Checkout vdl-hybrid-search
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-hybrid-search
          path: vdl-hybrid-search

      - name: Checkout vdl-ai-chat
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-ai-chat
          path: vdl-ai-chat

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            labs/pnpm-lock.yaml
            vdl-cbun/pnpm-lock.yaml
            vdl-hybrid-search/pnpm-lock.yaml
            vdl-ai-chat/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in vdl-cbun vdl-hybrid-search vdl-ai-chat; do
            echo "::group::Build $pkg"
            pnpm install --frozen-lockfile --dir "$pkg"
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright unit + e2e
        run: pnpm test
        env:
          CI: true

      - name: Build site
        run: pnpm build

      - name: Assert tests and smoke demos are not in dist
        run: |
          if [ -d dist/tests ]; then
            echo "dist/tests must not be published" >&2
            exit 1
          fi
          if ls dist/demo/gemma-* >/dev/null 2>&1; then
            echo "dist must not include gemma smoke demos" >&2
            exit 1
          fi
          test -f dist/CNAME
          grep -qx 'labs.vanduo.dev' dist/CNAME
