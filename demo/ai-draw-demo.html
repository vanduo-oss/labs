<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Draw (WebGPU + SVG Canvas) — Experimental</title>
  <meta name="description" content="In-browser AI-assisted SVG drawing canvas. Local Gemma 4 via WebGPU draws alongside you — no server required.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('vanduo-theme-preference') || 'dark';
        var resolved =
          pref === 'light' || pref === 'dark'
            ? pref
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="demo-root"></div>
  <script type="module" src="/src/demos/ai-draw-demo.js"></script>
</body>
</html>
